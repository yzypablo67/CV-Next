name: Android phone screenshots
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-screenshots.yml', 'tools/android-screenshots/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare screenshot-only build
        run: |
          bash scripts/build.sh
          bash scripts/test-average.sh
          python3 tools/android-screenshots/build.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture updated phone UI with demo API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell cmd uimode night yes
            adb install .tools/phone-screenshots/signed/demo-aligned-debugSigned.apk
            python3 tools/android-screenshots/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-screenshots
          path: phone-screenshots/
