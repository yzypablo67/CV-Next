name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::warning::Segreti di firma mancanti: verrà prodotto solo un APK non firmato.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cvnext.p12"
          chmod 600 "$RUNNER_TEMP/cvnext.p12"
      - name: Compile and sign
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/cvnext.p12
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ ! -f "$SIGNING_KEYSTORE" ]; then unset SIGNING_KEYSTORE; fi
          bash scripts/build.sh
      - name: Use signed recovery APK when signing secrets are unavailable
        run: |
          python3 scripts/use-prebuilt.py
          java -jar .tools/signer.jar --apks dist/CV-Next.apk --onlyVerify
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-Next
          path: |
            dist/CV-Next.apk
            dist/cv-next-unsigned.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f dist/CV-Next.apk ]; then
            echo '::error::Configurare ANDROID_KEYSTORE_BASE64 e ANDROID_SIGNING_PASSWORD per pubblicare APK firmati.'
            exit 1
          fi
          python3 scripts/check-release.py "${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/CV-Next.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/CV-Next.apk --title "CV Next ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cvnext.p12"
