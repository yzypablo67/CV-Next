name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cvnext.p12"
          chmod 600 "$RUNNER_TEMP/cvnext.p12"
      - name: Compile and sign
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/cvnext.p12
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: bash scripts/build.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-Next
          path: dist/CV-Next.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release.py "${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/CV-Next.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/CV-Next.apk --title "CV Next ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cvnext.p12"
