name: CVNext
options:
  bundleIdPrefix: io.github.yzypablo67
  deploymentTarget:
    iOS: '17.0'
packages:
  CVNextCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  CVNext:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Generated/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.yzypablo67.cvnext.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.yzypablo67.cvnext
            CFBundleURLSchemes: [cvnext]
    dependencies:
      - package: CVNextCore
      - target: CVNextWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yzypablo67.cvnext.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CV Next
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  CVNextWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: CV Next
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yzypablo67.cvnext.ios.widget
        TARGETED_DEVICE_FAMILY: '1,2'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  CVNext:
    build:
      targets:
        CVNext: all
